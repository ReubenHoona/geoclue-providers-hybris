# /etc/geoclue-qmiloc.conf: settings of the QMI location backend of
# geoclue-hybris (/usr/libexec/geoclue-hybris built from qmi/). Every key is
# optional; the values shown are the defaults. GEOCLUE_QMILOC_CONF in the
# environment names another file.

[engine]
# Lift the modem's engine lock (its default, 4, locks all sessions)
#unlock=true
# Register as the master client, as the Android location HAL does
#master_client=true
# Operation mode: standalone (no SUPL; XTRA is still used), default, msb, or
# provider (follow what geoclue-hybris asks for)
#mode=standalone

[position]
# Also report intermediate (in-progress) fixes, optionally only those with
# a horizontal uncertainty up to accuracy_threshold metres (0: any)
#intermediate=false
#accuracy_threshold=0

[satellites]
# Also report satellites the engine expects in view but does not track
# (no signal), as the Android HAL does
#untracked=true

[assistance]
# Inject the system time when the clock is NTP-synchronised
#time=true
# Inject the last fix (kept in the cache) as a coarse position, its
# uncertainty grown with its age
#position=true

[xtra]
# Download, cache and inject XTRA predicted orbits
#enabled=true
#servers=https://path1.xtracloud.net/xtra3Mgrbeji.bin, https://path2.xtracloud.net/xtra3Mgrbeji.bin, https://path3.xtracloud.net/xtra3Mgrbeji.bin
# Download again when the cached file is older than this
#refresh_hours=24
# Inject a stale cache (when downloads fail) only up to this age
#max_age_hours=168
# Also download over metered (cellular) connections
#metered=true
# Wait until connman reports a connection before downloading
#wait_for_network=true
#user_agent=

[cache]
# Where xtra.bin and last-position are kept (default ~/.cache/geoclue-qmiloc)
#dir=

[debug]
# Log every NMEA sentence the engine produces
#nmea=false
